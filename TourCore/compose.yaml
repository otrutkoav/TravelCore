name: tourcore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TOURCORE_POSTGRES_DB:-tourcore_admin}
      POSTGRES_USER: ${TOURCORE_POSTGRES_USER:-tourcore_admin}
      POSTGRES_PASSWORD: ${TOURCORE_POSTGRES_PASSWORD:-tourcore_dev_password}
    ports:
      - "${TOURCORE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - tourcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TourCoreDb: Host=postgres;Port=5432;Database=${TOURCORE_POSTGRES_DB:-tourcore_admin};Username=${TOURCORE_POSTGRES_USER:-tourcore_admin};Password=${TOURCORE_POSTGRES_PASSWORD:-tourcore_dev_password}
      Authentication__Jwt__SigningKey: ${TOURCORE_JWT_SIGNING_KEY:?Set TOURCORE_JWT_SIGNING_KEY in .env}
      Authentication__Jwt__RequireHttpsMetadata: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${TOURCORE_OTLP_GRPC_PORT:-4317}:4317"
      - "${TOURCORE_OTLP_HTTP_PORT:-4318}:4318"
      - "${TOURCORE_PROMETHEUS_PORT:-9464}:9464"
    restart: unless-stopped

  identity:
    build:
      context: .
      dockerfile: Identity.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Jwt__SigningKey: ${TOURCORE_JWT_SIGNING_KEY:?Set TOURCORE_JWT_SIGNING_KEY in .env}
      Identity__LocalUser__Username: ${TOURCORE_ADMIN_USERNAME:-admin}
      Identity__LocalUser__Password: ${TOURCORE_ADMIN_PASSWORD:?Set TOURCORE_ADMIN_PASSWORD in .env}
      Identity__LocalUser__PasswordHash: ""
      Identity__LocalUser__Roles__0: CatalogReader
      Identity__LocalUser__Roles__1: CatalogEditor
      Identity__LocalUser__Roles__2: CatalogAdmin
    ports:
      - "${TOURCORE_IDENTITY_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TourCoreDb: Host=postgres;Port=5432;Database=${TOURCORE_POSTGRES_DB:-tourcore_admin};Username=${TOURCORE_POSTGRES_USER:-tourcore_admin};Password=${TOURCORE_POSTGRES_PASSWORD:-tourcore_dev_password}
      Authentication__Jwt__SigningKey: ${TOURCORE_JWT_SIGNING_KEY:?Set TOURCORE_JWT_SIGNING_KEY in .env}
      Authentication__Jwt__RequireHttpsMetadata: "false"
      Authentication__Swagger__TokenUrl: http://localhost:${TOURCORE_IDENTITY_PORT:-8081}/connect/token
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    ports:
      - "${TOURCORE_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  tourcore-postgres-data:
